[package]
name = "gatherer-hub"
version = "0.0.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Gatherer Hub — standalone iced+cpal mixer that gathers DAW-routed audio"

[[bin]]
name = "gatherer-hub"
path = "src/main.rs"

[dependencies]
# Versions pinned to match FIELD (/Users/felix/Documents/Coding/FIELD) so its
# audio/iced/widget patterns transfer cleanly.
iced = { version = "0.13", features = ["tokio", "canvas", "advanced"] }
cpal = "0.15"
atomic_float = "1"
# Lock-free SPSC ring to bridge the input (capture) and output (monitor) streams,
# and to feed the recording writer thread.
rtrb = "0.3"
# WAV writing for per-source recording (background writer thread).
hound = "3"
# Lock-free Arc swap — publish loaded playback buffers UI → audio thread.
arc-swap = "1"
# MIDI input (Clock/transport sync from the DAW). Virtual input port on
# macOS/Linux; the hub appears as a MIDI destination called "Gatherer Hub".
midir = "0.10"
# LUFS loudness measurement (BS.1770) for per-source normalization on export.
ebur128 = "0.1"
# Session save/load — TOML next to the session's audio folders.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
